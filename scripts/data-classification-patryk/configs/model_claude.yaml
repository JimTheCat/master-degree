_base_: base.yaml

model:
  type: "anthropic"
  name: "claude-opus-5"
  # temperature omitted — Opus 5 (like 4.7/4.8) rejects sampling params (400).
  # Opus 5 runs adaptive thinking and thinking tokens count against the output
  # budget — 500 tokens would truncate the JSON mid-label (same failure mode
  # as Gemini 2.5; see model_gemini.yaml).
  max_completion_tokens: 4096

prompt:
  variant: "fewshot"
  num_examples: 3
  example_selection: "stratified"

experiment:
  name: "model-claude-opus-5"
  mlflow_experiment: "parliament-model-comparison"
