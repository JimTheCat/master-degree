[project]
name = "parliament-speech-analysis"
version = "0.1.0"
description = "Automatic detection of emotions and rhetorical techniques in Polish parliamentary speeches"
requires-python = ">=3.11"

dependencies = [
    # Core
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",

    # Data
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",

    # Transformer baseline
    "torch>=2.1",
    "transformers>=4.36",
    "datasets>=2.16",
    "accelerate>=0.25",

    # LLM APIs
    "openai>=1.10",
    "anthropic>=0.40",
    "httpx>=0.27",

    # LangChain — unified LLM interface + structured output
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",

    # Experiment tracking
    "langsmith>=0.7",
    "mlflow>=3.5",

    # Async and rate-limiting
    "aiofiles>=23.0",
    "tenacity>=8.2",
    "aiolimiter>=1.1",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",

    # Progress and CLI
    "tqdm>=4.66",
    "rich>=13.0",

    # Markdown tables — pandas.DataFrame.to_markdown backend
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "jupyter>=1.0",
    "ipykernel>=6.28",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
